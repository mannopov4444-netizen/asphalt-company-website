<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ABDULAZIZ PARTNER BUILD — асфальтирование</title>
<meta name="description" content="Укладка и ремонт асфальта. Asfalt yotqizish va taʼmirlash. Asphalt paving and repair.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛣️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fff;--bg2:#f5f2ea;--tx:#161616;--mu:#5a5750;--card:#fff;--bd:#e4dfd2;--am:#f5a31a;--am2:#c97f00;--dk:#161616;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121212;--bg2:#1a1a19;--tx:#f1efe9;--mu:#a9a69d;--card:#1f1f1e;--bd:#33322f;--am2:#f5a31a}}
:root[data-theme="dark"]{--bg:#121212;--bg2:#1a1a19;--tx:#f1efe9;--mu:#a9a69d;--card:#1f1f1e;--bd:#33322f;--am2:#f5a31a}
html{scroll-padding-top:calc(72px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.6 Inter,system-ui,sans-serif}
body:before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--dk);z-index:10}
h1,h2,h3{font-weight:700;font-family:Oswald,"Arial Narrow",sans-serif;line-height:1.05;margin:0;text-wrap:balance}
a{color:inherit}
.w{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--dk);color:#fff}
header .w{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 20px Oswald,"Arial Narrow",sans-serif;letter-spacing:.02em}
.brand img{width:44px;height:44px;border-radius:50%;background:#fff}
nav{display:flex;gap:20px;margin-left:auto}
nav a{text-decoration:none;font-weight:500;color:#ddd}
nav a:hover{color:var(--am)}
.lang{display:flex;gap:2px;background:#2a2a2a;border-radius:8px;padding:2px}
.lang button{border:0;background:none;color:#ccc;font:600 13px Inter,system-ui,sans-serif;padding:6px 9px;border-radius:6px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--am);color:#111}
.btn{display:inline-block;border:0;border-radius:6px;padding:13px 22px;font:600 17px Inter,system-ui,sans-serif;text-decoration:none;cursor:pointer;background:var(--am);color:#111}
.btn:hover{background:#ffb83d}
.btn.o{background:none;border:2px solid currentColor;color:inherit}
.btn.o:hover{background:rgba(255,255,255,.1)}
:focus-visible{outline:3px solid var(--am);outline-offset:2px}
.hero{background:var(--dk);color:#fff;padding:56px 0 0;position:relative;overflow:hidden}
.hero .w{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.badge{display:inline-block;background:var(--am);color:#111;font-weight:600;padding:4px 12px;border-radius:4px;margin-bottom:18px}
.hero h1{font-size:clamp(38px,7vw,76px);font-weight:700;text-transform:uppercase;letter-spacing:.005em}
.hero p{color:#cfcfcf;max-width:52ch;margin:18px 0 26px}
.row{display:flex;flex-wrap:wrap;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px 22px;margin:28px 0 0;padding:0;list-style:none;color:#e8e8e8}
.chips li:before{content:"✓ ";color:var(--am)}
.logo{background:#fff;border-radius:50%;width:min(100%,400px);aspect-ratio:1;justify-self:center;overflow:hidden;box-shadow:0 0 0 8px var(--am)}
.logo img{width:100%;height:100%;display:block}
.road{height:44px;margin-top:48px;background:#2b2b2b;position:relative}
.road:after{content:"";position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;background:repeating-linear-gradient(90deg,var(--am) 0 46px,transparent 46px 92px)}
section{padding:72px 0}
.alt{background:var(--bg2)}
h2{font-size:clamp(32px,4.5vw,46px);font-weight:700;text-transform:uppercase}
.sub{color:var(--mu);margin:10px 0 36px;max-width:60ch}
.g{display:grid;gap:18px}
.g4{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.srv{background:var(--card);border:1px solid var(--bd);border-top:5px solid var(--am);padding:24px}
.srv i{font-style:normal;font-size:34px}
.srv h3{font-size:23px;font-weight:600;margin:10px 0 8px}
.srv p{margin:0;color:var(--mu)}
.split{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.lay{display:flex;flex-direction:column-reverse;gap:0}
.lay div{padding:16px 20px;color:#fff;font:600 20px Oswald,"Arial Narrow",sans-serif;letter-spacing:.03em}
.lay div:nth-child(1){background:#6b4a2b}
.lay div:nth-child(2){background:#8b7b68}
.lay div:nth-child(3){background:#3a3a3a}
.lay div:nth-child(4){background:#0d0d0d;border-top:4px solid var(--am);padding:22px 20px}
.prj{position:relative;height:200px;display:flex;align-items:flex-end;padding:16px;color:#fff;font:700 24px Oswald,"Arial Narrow",sans-serif;background:linear-gradient(160deg,#444,#161616)}
.prj:before{content:attr(data-e);position:absolute;right:14px;top:6px;font-size:64px;opacity:.9}
.prj:after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--am) 0 24px,transparent 24px 48px)}
.prj:nth-child(2n){background:linear-gradient(160deg,#5a4a2a,#1a1a1a)}
.prj:nth-child(3n){background:linear-gradient(160deg,#2c3a44,#141414)}
.rev{background:var(--card);border:1px solid var(--bd);padding:24px;margin:0}
.rev p{margin:0 0 16px}
.rev b{display:block}
.rev span{color:var(--mu);font-size:15px}
.st{color:var(--am);letter-spacing:3px;margin-bottom:8px}
form{background:var(--card);border:1px solid var(--bd);padding:26px;display:grid;gap:14px}
label{display:grid;gap:5px;font-weight:600;font-size:15px}
input,select{font:inherit;padding:12px;border:2px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx)}
input:focus,select:focus{border-color:var(--am);outline:none}
.err{color:#d33;min-height:1.4em;margin:0;font-size:15px}
.con{background:var(--card);border:1px solid var(--bd);padding:22px;text-decoration:none;display:block}
.con small{color:var(--mu);display:block}
.con b{font-size:19px;display:block;overflow-wrap:anywhere}
footer{background:var(--dk);color:#aaa;padding:28px 0;font-size:15px}
footer .w{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:820px){nav{display:none}.lang{margin-left:auto}.hero .w,.split{grid-template-columns:1fr}.logo{width:min(80%,320px);order:-1}.brand span{display:none}section{padding:52px 0}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.stats{background:var(--am);color:#111}.stats .w{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding-top:22px;padding-bottom:22px}.stats b{display:block;font:800 clamp(26px,4vw,40px) Oswald,"Arial Narrow",sans-serif}.stats span{display:block;font-size:15px;line-height:1.3}
.ul{list-style:none;padding:0;margin:0;display:grid;gap:14px}.ul li{padding-left:30px;position:relative}.ul li:before{content:"✓";position:absolute;left:0;color:var(--am2);font-weight:800}
.tmc{background:var(--card);border:1px solid var(--bd);padding:22px;text-align:center}.tmc b{display:block;font:800 42px Oswald,"Arial Narrow",sans-serif}.tmc span{color:var(--am2);font-weight:600;font-size:22px}
details{background:var(--card);border:1px solid var(--bd);padding:16px 20px;margin-bottom:10px}summary{font-weight:600;cursor:pointer}details p{margin:10px 0 0;color:var(--mu)}
@media(max-width:820px){.stats .w{grid-template-columns:1fr 1fr}}
</style>
</head>
