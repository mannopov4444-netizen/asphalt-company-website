fqh:"FAQ",fq:[["How much does asphalt paving cost?","Approximately 80,000 UZS per m² at a 5 cm layer; the price depends on thickness. We prepare an exact estimate after a free site measurement."],["How much does a visit and consultation cost?","It is free. A specialist will come, assess the site, take measurements and prepare an exact estimate."],["Do you work on weekends and holidays?","Yes, daily from 7:00 to 22:00, with no days off."],["Is there an official guarantee?","Yes, a written 5-year guarantee on the surface."],["What documents do you provide?","We sign a contract, approve the estimate and provide closing documents."]],
seo:"ABDULAZIZ PARTNER BUILD — asphalt paving across Uzbekistan: Tashkent, Samarkand, Bukhara, Fergana, Andijan, Namangan, Navoi, Karshi, Termez, Nukus, Urgench, Jizzakh, Gulistan. Asphalt paving, road repair, pothole repair, paving of yards, parking lots and sites, road marking, curb installation, drainage and site improvement. Order turnkey paving with a 5-year guarantee.",rgh:"Where we work",rgs:"We go to sites across all of Uzbekistan. Do not see your region? Call us — we will come there too.",rg:["Tashkent city","Tashkent region","Samarkand region","Bukhara region","Fergana region","Andijan region","Namangan region","Navoi region","Kashkadarya region","Surkhandarya region","Khorezm region","Jizzakh region","Syrdarya region","Republic of Karakalpakstan"],cbh:"We will call you back within 5 minutes",cbs:"Leave your number — we will call and answer your questions.",cbb:"Call me back",cbe:"Please enter the full phone number.",cbm:"Callback request (ABDULAZIZ PARTNER BUILD website)",sph:"How we work",sp:[["Request","Call or write — we reply within 5 minutes."],["Free measurement","A specialist visits the site and assesses the work."],["Contract and estimate","We fix the scope, timeline and price in writing."],["Work and handover","We pave, clean up and give a 5-year guarantee."]],clh:"Work volume calculator",cls:"Move the sliders to see the approximate amount of asphalt and the time needed.",cla:"Area",clt:"Layer thickness",tu:"cm",clr1:"tons of asphalt mix (approx.)",clr2:"days of work",clr3:"UZS — estimated cost (80,000 UZS per m² at a 5 cm layer)",cln:"This is an estimate. A specialist will prepare an exact quote after a free site measurement.",clb:"Get an exact quote",bal:"Before",baa:"After",fc:"Call",hrl:"Working hours",hr:"Daily, 7:00–22:00",cs:"Call or write — we reply within 5 minutes."}};

$('#cb').onclick=()=>{const t=T[L];window.open('https://t.me/MANNOPOV7777777?text='+encodeURIComponent(`${t.mh}\n${t.ma}: ${$('#ar').value} m²\n${t.clt}: ${$('#tr').value} ${t.tu}\n≈ ${$('#r1').textContent} t\n≈ ${$('#r3').textContent} UZS`),'_blank','noopener')};
render();
if('IntersectionObserver' in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);if(e.target.id==='st')count()}}),{threshold:.12});
document.querySelectorAll('section .w,.stats .w').forEach(e=>{e.classList.add('rv');io.observe(e)})}
</script>
</body>
